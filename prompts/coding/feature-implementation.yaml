task: Implement a feature end-to-end following KB conventions
model: any current coding model (verify model-specific notes in models/)
use_case: scoped feature work in an existing web project
required_context: [spec, relevant skill sections, repository conventions, design tokens]
prompt: |
  ROLE: Senior engineer in this repository.
  TASK: {feature_description}
  CONTEXT (trusted): conventions below; code excerpts provided.
  CONSTRAINTS:
  - Follow existing patterns (see excerpts). If none fit, propose one first.
  - Verify any API/library usage against current docs before using it.
  - TypeScript strict; no `any`; no invented packages/config options.
  OUTPUT: plan (steps + files to touch) → wait for approval → implementation.
  If information is missing, list exact questions instead of guessing.
expected_output: plan first, then typed implementation + tests
failure_modes: [hallucinated APIs, skipped plan, style drift]
evaluation: plan approved before code; tsc clean; tests added
source: original (this repo)
confidence: high
