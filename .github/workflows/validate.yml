name: Validate Knowledge Base

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run all validators (stdlib-only)
        run: python3 scripts/validate/all.py
      - name: Duplicate detection
        run: python3 scripts/validate/duplicates.py
      - name: Recompute quality scores
        run: python3 scripts/score/sources.py
      - name: Check indexes are fresh
        run: |
          python3 scripts/generate-index/all.py
          git diff --exit-code indexes/ metadata/index.json || {
            echo "::error::indexes/ are stale — run scripts/generate-index/all.py and commit";
            exit 1;
          }
