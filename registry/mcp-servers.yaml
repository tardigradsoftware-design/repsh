# MCP (Model Context Protocol) sunucuları kaydı.
# Şema: schemas/mcp-entry.schema.json
#
# Her kayıt için GÜVENLİK DEĞERLENDİRMESİ zorunludur. Yanlış MCP izni prompt injection ve
# veri sızıntısı yaratabilir. Bkz. knowledge/agent-engineering/mcp-security.md.

- id: mcp-playwright
  title: Playwright MCP (resmi)
  type: mcp
  url: https://github.com/microsoft/playwright-mcp
  owner: microsoft
  repo: microsoft/playwright-mcp
  license: Apache-2.0
  status: ACTIVE
  summary: |
    Tarayıcıyı MCP üzerinden kontrol ettirir; snapshot alma, click/fill/navigate, screenshot,
    erişilebilirlik ağacı çekme, konsol/network kaydı.
  why_useful: |
    Ajanın siteyi gerçekten görüp test etmesi için en etkili MCP'lerden; görsel doğrulama ve
    E2E test otomasyonu temel aracı.
  best_for: [E2E test yardımcı pilotu, görsel doğrulama, canlı site keşfi, accessibility snapshot]
  not_for: [Üretim otomasyonu (kırılgan yüksek hızlı akışlar için native Playwright kullan)]
  limitations: Web'deki içeriği okuyup prompt'a döndürdüğü için prompt injection yüzeyi vardır;
    güvenilmeyen sayfaları gezerken dikkat.
  permissions:
    filesystem_read: false
    filesystem_write: true     # screenshot ve trace dosyası yazar
    network_outbound: true     # tarayıcı üzerinden dış ağ erişimi
    credential_access: false   # eğer browser context'e kayıtlı cookie/credential yüklenirse risk doğar
    code_execution: false
    browser_control: true
    database_access: false
  network_access: any
  credential_access: none
  code_execution: none
  security_risk: medium
  local_or_remote: local
  setup_complexity: low
  prompt_injection_surface: high    # ziyaret edilen sayfa içeriği prompt'a girebilir
  security_notes: |
    - Tarayıcı context'ine kaydedilmiş cookie/password asla prod değerlerle kullanma.
    - Dış site gezdirmelerini isolate context ile yap.
    - Screenshot/trace dosyalarını temp dizinine yaz, proje içine rastgele bırakma.
  confidence: high
  evidence_level: RECOMMENDATION
  tags: [mcp, browser, testing, playwright, e2e, visual]
  related: [playwright]
  verified_at: 2026-09-20
  expires_at: 2026-11-20
  source_urls:
    - https://github.com/microsoft/playwright-mcp

- id: mcp-supabase
  title: Supabase MCP (resmi)
  type: mcp
  url: https://github.com/supabase/mcp
  owner: supabase
  repo: supabase/mcp
  license: Apache-2.0
  status: ACTIVE
  summary: |
    Supabase yönetim API'si üstünden projeleri yönetme; migration planlama ve onayla çalıştırma,
    SQL çalıştırma, veri okuma/yazma, log ve branch yönetimi.
  why_useful: |
    Supabase projelerini ajan üzerinden güvenli yönetim; management API üzerinden çalıştığı için
    doğrudan DB erişiminden daha sınırlı yüzey sağlar (okuma/yazma ayrımı, onaylı migration).
  best_for: [Development ortamında DB şeması tasarımı, RLS debug, veri keşfi]
  not_for: [Production'a onaysız migration / toptan veri silme]
  permissions:
    filesystem_read: false
    filesystem_write: true     # migration dosyası yazar
    network_outbound: true     # Supabase API'ye
    credential_access: true    # Supabase access token / Personal Access Token gerekir
    code_execution: false
    browser_control: false
    database_access: true      # Management API üzerinden SQL çalıştırabilir
  network_access: known-hosts  # Supabase API'lerine
  credential_access: user-scoped
  code_execution: none
  security_risk: high
  local_or_remote: hybrid
  setup_complexity: low
  prompt_injection_surface: low
  security_notes: |
    - Personal Access Token'ı sadece gerekli proje için minimum yetkiyle üret.
    - Production ortamında salt okunur ayrı bir token kullan; yazma izinlerini development ile sınırla.
    - Migration'ları her zaman onaydan geçir; otomatik çalıştırma KAPALI tut.
  confidence: high
  evidence_level: RECOMMENDATION
  tags: [mcp, supabase, database, postgres, migrations]
  related: [supabase]
  verified_at: 2026-09-20
  expires_at: 2026-11-20
  source_urls:
    - https://github.com/supabase/mcp

- id: mcp-filesystem
  title: MCP Filesystem (resmi referans)
  type: mcp
  url: https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem
  owner: modelcontextprotocol
  repo: modelcontextprotocol/servers
  license: NOASSERTION
  status: ACTIVE
  summary: |
    Belirtilen kök dizinler altında dosya okuma/yazma/listeme/arama işlemlerini MCP üzerinden sunar.
  why_useful: |
    Repo ve proje dosyaları üzerinde çalışan ajanların dosya sistemine kontrollü erişimi.
  best_for: [Belirli bir proje kökü ile sınırlı dosya erişimi]
  not_for: [Sistem dizinleri, gizli dosyalarla çalışma]
  permissions:
    filesystem_read: true
    filesystem_write: true
    network_outbound: false
    credential_access: false
    code_execution: false
    browser_control: false
    database_access: false
  network_access: none
  credential_access: none
  code_execution: none
  security_risk: high
  local_or_remote: local
  setup_complexity: trivial
  prompt_injection_surface: medium   # dışarıdan okunan dosya içeriği prompt'a gidebilir
  security_notes: |
    - Erişilecek dizinleri açıkça beyaz listeye al; kök dizini / veya ev dizini olarak verme.
    - .env, *.pem, id_rsa gibi dosyaların okunmasını ek bir filtre ile engelle.
    - Yazma iznini sadece proje dizinleri ile sınırla.
  confidence: high
  evidence_level: RECOMMENDATION
  tags: [mcp, filesystem, reference]
  related: [modelcontextprotocol-servers]
  verified_at: 2026-09-20
  expires_at: 2026-12-20
  source_urls:
    - https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem

